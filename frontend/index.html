<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Runs before any app JS loads. On a hard reload the browser restores
      // the last scroll position by default, which can land mid/bottom of
      // the page before React ever mounts. Disabling it here (as early as
      // possible) makes every reload start at the top of the page.
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      window.scrollTo(0, 0);
    </script>
    <!-- TODO: Set the document title to the name of your application -->
