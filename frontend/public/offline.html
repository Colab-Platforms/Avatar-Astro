<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#803003" />
    <title>Bhagya Astro – You're offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #F5E9D6; color: #33251D; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
      main { max-width: 420px; }
      img { width: 96px; height: 96px; border-radius: 22px; background: #803003; }
      h1 { margin: 20px 0 8px; font-size: 1.5rem; color: #54230F; }
      p { margin: 0 0 20px; line-height: 1.5; color: #6B4A37; }
      button { background: #803003; color: #F5E9D6; border: 0; border-radius: 999px; padding: 12px 28px; font-size: 1rem; cursor: pointer; }
      button:focus-visible { outline: 3px solid #C18A3D; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="96" height="96" />
      <h1>You're offline</h1>
      <p>Bhagya needs an internet connection for readings, your saved details and your account. Please check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
