<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 492" role="img" aria-label="A car and a registration plate under a crescent moon and stars">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1205"/>
      <stop offset="0.55" stop-color="#5b2209"/>
      <stop offset="1" stop-color="#c9873a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e4"/>
      <stop offset="1" stop-color="#f1d9a6"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f7ebd2"/>
    </linearGradient>
    <symbol id="star" viewBox="-10 -10 20 20"><path d="M0-9 2.2-2.2 9 0 2.2 2.2 0 9-2.2 2.2-9 0-2.2-2.2Z" fill="#fff3c9"/></symbol>
    <symbol id="wheel" viewBox="-50 -50 100 100">
      <circle r="46" fill="#1d0c03" stroke="#c9873a" stroke-width="5"/>
      <circle r="27" fill="#f7dc8a" stroke="#8a5a1e" stroke-width="3"/>
      <g stroke="#8a5a1e" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-24" x2="0" y2="24"/><line x1="-24" y1="0" x2="24" y2="0"/>
        <line x1="-17" y1="-17" x2="17" y2="17"/><line x1="17" y1="-17" x2="-17" y2="17"/>
      </g>
      <circle r="6" fill="#592209"/>
    </symbol>
  </defs>

  <rect width="960" height="492" fill="url(#sky)"/>
  <circle cx="480" cy="230" r="300" fill="url(#glow)"/>

  <!-- crescent moon -->
  <path d="M760 70a52 52 0 1 0 0 104a42 42 0 1 1 0-104z" fill="#fff3c9" opacity="0.95"/>

  <!-- stars -->
  <g opacity="0.95">
    <use href="#star" x="90" y="60" width="26" height="26"/>
    <use href="#star" x="210" y="130" width="16" height="16"/>
    <use href="#star" x="140" y="220" width="20" height="20"/>
    <use href="#star" x="330" y="55" width="14" height="14"/>
    <use href="#star" x="470" y="95" width="22" height="22"/>
    <use href="#star" x="620" y="62" width="18" height="18"/>
    <use href="#star" x="860" y="150" width="26" height="26"/>
    <use href="#star" x="900" y="60" width="14" height="14"/>
    <use href="#star" x="820" y="250" width="18" height="18"/>
    <use href="#star" x="60" y="140" width="12" height="12"/>
  </g>

  <!-- road -->
  <ellipse cx="490" cy="408" rx="400" ry="22" fill="#1d0c03" opacity="0.55"/>

  <!-- car -->
  <g>
    <path d="M214 352C214 326 230 314 258 308L330 303C358 270 398 250 450 248L566 248C618 250 650 282 676 302L728 308C754 312 766 328 766 350L766 366L214 366Z" fill="url(#body)" stroke="#c9873a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M372 303C392 280 424 264 458 264L522 264L522 303Z" fill="#5b2209"/>
    <path d="M538 264L566 264C598 266 620 286 640 303L538 303Z" fill="#5b2209"/>
    <path d="M522 264V350" stroke="#c9873a" stroke-width="3"/>
    <ellipse cx="752" cy="334" rx="14" ry="10" fill="#ffd97a"/>
    <ellipse cx="226" cy="334" rx="9" ry="9" fill="#e5533d"/>
    <path d="M236 352H764" stroke="#c9873a" stroke-width="3" opacity="0.7"/>
    <use href="#wheel" x="285" y="316" width="104" height="104"/>
    <use href="#wheel" x="592" y="316" width="104" height="104"/>
  </g>

  <!-- registration plate -->
  <g>
    <rect x="374" y="402" width="232" height="66" rx="12" fill="url(#plate)" stroke="#592209" stroke-width="5"/>
    <rect x="382" y="410" width="216" height="50" rx="8" fill="none" stroke="#c9873a" stroke-width="2"/>
    <text x="490" y="448" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" letter-spacing="6" fill="#301607">0007</text>
  </g>
</svg>
