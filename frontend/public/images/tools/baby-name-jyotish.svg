<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 492" role="img" aria-label="A sleeping baby in a crescent-moon cradle among stars">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1706"/>
      <stop offset="0.55" stop-color="#6b2a0d"/>
      <stop offset="1" stop-color="#c9873a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c9"/>
      <stop offset="1" stop-color="#e5a948"/>
    </linearGradient>
    <linearGradient id="blanket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe3c4"/>
      <stop offset="1" stop-color="#f1b98a"/>
    </linearGradient>
    <symbol id="star" viewBox="-10 -10 20 20"><path d="M0-9 2.2-2.2 9 0 2.2 2.2 0 9-2.2 2.2-9 0-2.2-2.2Z" fill="#fff3c9"/></symbol>
    <symbol id="petal" viewBox="-20 -60 40 60"><path d="M0 0C-22-20-18-48 0-60 18-48 22-20 0 0Z" fill="#f7d9b0" stroke="#c9873a" stroke-width="1.5"/></symbol>
  </defs>

  <rect width="960" height="492" fill="url(#sky)"/>
  <circle cx="480" cy="215" r="250" fill="url(#glow)"/>

  <!-- stars -->
  <g opacity="0.95">
    <use href="#star" x="90" y="70" width="26" height="26"/>
    <use href="#star" x="210" y="150" width="16" height="16"/>
    <use href="#star" x="150" y="260" width="20" height="20"/>
    <use href="#star" x="300" y="60" width="14" height="14"/>
    <use href="#star" x="380" y="120" width="22" height="22"/>
    <use href="#star" x="640" y="70" width="18" height="18"/>
    <use href="#star" x="760" y="140" width="28" height="28"/>
    <use href="#star" x="860" y="80" width="16" height="16"/>
    <use href="#star" x="820" y="260" width="20" height="20"/>
    <use href="#star" x="700" y="200" width="12" height="12"/>
    <use href="#star" x="60" y="190" width="12" height="12"/>
  </g>

  <!-- crescent-moon cradle -->
  <path d="M250 205C250 330 355 395 480 395S710 330 710 205C660 285 575 318 480 318S300 285 250 205Z" fill="url(#moon)" stroke="#fff3c9" stroke-width="3" stroke-linejoin="round"/>
  <path d="M250 205C262 188 280 180 296 188" stroke="#e5a948" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M710 205C698 188 680 180 664 188" stroke="#e5a948" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- swaddled baby -->
  <g>
    <ellipse cx="480" cy="268" rx="118" ry="52" fill="url(#blanket)" stroke="#d99a62" stroke-width="2"/>
    <path d="M385 262C420 282 540 282 575 262" stroke="#d99a62" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M400 282C440 302 520 302 560 282" stroke="#d99a62" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="480" cy="205" r="52" fill="#ffd9b8" stroke="#d99a62" stroke-width="2"/>
    <path d="M440 190C450 158 510 158 520 190C505 176 455 176 440 190Z" fill="#4a2410"/>
    <path d="M455 206Q466 214 477 206" stroke="#4a2410" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M483 206Q494 214 505 206" stroke="#4a2410" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M470 228Q480 236 490 228" stroke="#c4623c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="450" cy="222" r="9" fill="#f6a58c" opacity="0.65"/>
    <circle cx="510" cy="222" r="9" fill="#f6a58c" opacity="0.65"/>
    <circle cx="480" cy="170" r="5" fill="#c9873a"/>
  </g>

  <!-- lotus -->
  <g transform="translate(480 470)">
    <use href="#petal" x="-20" y="-60" width="40" height="60" transform="rotate(-70)"/>
    <use href="#petal" x="-20" y="-60" width="40" height="60" transform="rotate(70)"/>
    <use href="#petal" x="-20" y="-60" width="40" height="60" transform="rotate(-38)"/>
    <use href="#petal" x="-20" y="-60" width="40" height="60" transform="rotate(38)"/>
    <use href="#petal" x="-20" y="-60" width="40" height="60"/>
  </g>
  <g transform="translate(200 460)" opacity="0.9">
    <use href="#petal" x="-20" y="-60" width="40" height="60" transform="rotate(-40) scale(0.7)"/>
    <use href="#petal" x="-20" y="-60" width="40" height="60" transform="rotate(40) scale(0.7)"/>
    <use href="#petal" x="-20" y="-60" width="40" height="60" transform="scale(0.7)"/>
  </g>
  <g transform="translate(760 460)" opacity="0.9">
    <use href="#petal" x="-20" y="-60" width="40" height="60" transform="rotate(-40) scale(0.7)"/>
    <use href="#petal" x="-20" y="-60" width="40" height="60" transform="rotate(40) scale(0.7)"/>
    <use href="#petal" x="-20" y="-60" width="40" height="60" transform="scale(0.7)"/>
  </g>
</svg>
